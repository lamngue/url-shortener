services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: shortener
      POSTGRES_USER: shortener
      POSTGRES_PASSWORD: shortener # local development only
    ports:
      - "5432:5432"
    volumes:
      # Postgres 18+ images declare the volume at /var/lib/postgresql (PGDATA is a subfolder)
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shortener -d shortener"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  kafka:
    # Single Kafka node in KRaft mode (no ZooKeeper). With no extra settings the official image
    # listens on localhost:9092, which is what the app on your machine connects to.
    image: apache/kafka:4.3.1
    ports:
      - "9092:9092"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null"]
      interval: 10s
      timeout: 10s
      retries: 10

volumes:
  postgres-data:

# Loaded on top of src/main/resources/application.yml when the "test" profile is active.
# Only test-only values belong here. Postgres and Redis connections come from the
# Testcontainers @ServiceConnection beans, not from this file.
shortener:
  # TEST VALUE ONLY. Never use this K outside tests.
  short-code-k: 2654435761

spring:
  kafka:
    admin:
      # Integration tests have no Kafka container: do not try to create the topic at startup.
      auto-create: false
    listener:
      # No Kafka in integration tests: the consumer is not started. Tests call it directly.
      auto-startup: false

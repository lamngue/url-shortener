spring:
  application:
    name: url-shortener

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:shortener}
    username: ${DB_USER:shortener}
    password: ${DB_PASSWORD:shortener}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      # Redis is only a cache: give up quickly and fall back to Postgres (Lettuce waits 60s by default).
      timeout: 100ms
      connect-timeout: 100ms

  mvc:
    problemdetails:
      enabled: true

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      # acks=all: Kafka confirms only when every in-sync copy has the event (also Kafka's default).
      acks: all
      properties:
        # The redirect must not wait for Kafka: give up after 100 ms and drop the click (D-04).
        # Kafka's default would block the request thread for up to 60 seconds.
        max.block.ms: 100

shortener:
  base-url: ${APP_BASE_URL:http://localhost:8080}
  # Required: the secret multiplier for the short code shuffle. No default on purpose.
  # The empty default turns a missing variable into null, so @NotNull reports "k is required"
  # instead of Spring's generic "Could not resolve placeholder".
  short-code-k: ${SHORT_CODE_K:}
  cache:
    positive-ttl: 5m
    negative-ttl: 10s
    jitter: 0.1

management:
  health:
    redis:
      # Redis is optional (reads fall back to Postgres), so a Redis outage must not mark
      # every instance DOWN and make the load balancer drop them all.
      enabled: false

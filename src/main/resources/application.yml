spring:
  application:
    name: url-shortener

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:shortener}
    username: ${DB_USER:shortener}
    password: ${DB_PASSWORD:shortener}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      # Redis is only a cache: give up quickly and fall back to Postgres (Lettuce waits 60s by default).
      timeout: 100ms
      connect-timeout: 100ms

  mvc:
    problemdetails:
      enabled: true

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      # acks=all: Kafka confirms only when every in-sync copy has the event (also Kafka's default).
      acks: all
      # Click events are sent as JSON. No Java class name in the message headers, so the consumer
      # does not depend on the sender's class names.
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer
      properties:
        spring.json.add.type.headers: false
        # The redirect must not wait for Kafka: give up after 100 ms and drop the click (D-04).
        # Kafka's default would block the request thread for up to 60 seconds.
        max.block.ms: 100
    consumer:
      group-id: click-stats
      # A new consumer group starts from the oldest event still in Kafka, so no click is skipped.
      auto-offset-reset: earliest
      # A message that is not valid JSON is turned into an error the error handler skips,
      # instead of failing forever and blocking its partition.
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JacksonJsonDeserializer
        spring.json.value.default.type: com.example.shortener.recorder.ClickEvent
        spring.json.use.type.headers: false

shortener:
  base-url: ${APP_BASE_URL:http://localhost:8080}
  # Access tokens (D-05): Auth0's public keys (JWKS), the expected "iss" and "aud".
  # The defaults are placeholders; without real values, /api answers 401.
  jwt:
    jwk-set-uri: ${JWT_JWK_SET_URI:http://localhost:9000/.well-known/jwks.json}
    issuer: ${JWT_ISSUER:http://localhost:9000}
    audience: ${JWT_AUDIENCE:url-shortener}
  # Required secret multiplier for the shuffle. The empty default makes a missing value null,
  # so startup fails with "k is required" instead of a generic placeholder error.
  short-code-k: ${SHORT_CODE_K:}
  cache:
    positive-ttl: 5m
    negative-ttl: 10s
    jitter: 0.1

management:
  health:
    redis:
      # Redis is optional (reads fall back to Postgres), so a Redis outage must not mark
      # every instance DOWN and make the load balancer drop them all.
      enabled: false

springdoc:
  # Swagger UI at /swagger-ui/index.html, OpenAPI spec at /v3/api-docs.
  # On for local use; set SWAGGER_ENABLED=false where the API docs should not be public.
  api-docs:
    enabled: ${SWAGGER_ENABLED:true}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:true}
    oauth:
      client-id: ${AUTH0_CLIENT_ID:PeWnBEO9JHh4v84BtGH205cZ5JPLQExw}
      use-pkce-with-authorization-code-grant: true
      additional-query-string-params: 
        audience: ${JWT_AUDIENCE:url-shortener}
      scopes: openid, profile, email

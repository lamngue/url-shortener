upstream app_servers {
    zone app_servers 64k; # workers keep the upstream state in shared memory, including round robin counters and health check statuses
    server app1:8080;
    server app2:8080;
}

server {
    listen 8080;

    location / {
        proxy_pass http://app_servers;
        proxy_set_header Host $http_host;
    }
    add_header X-Upstream-Addr $upstream_addr always;
}


